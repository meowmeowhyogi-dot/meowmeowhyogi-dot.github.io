<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#fff1ee">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="金龙鱼响片课">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>金龙鱼响片训练｜第一节学习面板</title>
  <style>
    :root {
      --bg: #fff9f2;
      --card: #ffffff;
      --text: #403344;
      --muted: #897b89;
      --line: #eee1e6;
      --primary: #a45a88;
      --primary-soft: #f9e9f2;
      --success: #4c9075;
      --yellow: #ffd75e;
      --peach: #ffcdbd;
      --shadow: 0 12px 30px rgba(112, 72, 92, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15px 15px, rgba(164, 90, 136, .055) 2px, transparent 2.5px) 0 0 / 30px 30px,
        linear-gradient(180deg, #fff1ee 0, var(--bg) 340px);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      line-height: 1.55;
    }

    button, input, textarea { font: inherit; }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: 24px 14px 48px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      align-items: center;
      min-height: 210px;
      margin-bottom: 14px;
      padding: 25px 18px 24px;
      overflow: hidden;
      background: linear-gradient(135deg, #fff 0%, #fff8dc 60%, #ffe7ef 100%);
      border: 1px solid rgba(164, 90, 136, .09);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      position: absolute;
      content: '';
      border-radius: 50%;
      opacity: .55;
    }

    .hero::before {
      width: 112px;
      height: 112px;
      top: -48px;
      left: -36px;
      background: #ffd7e6;
    }

    .hero::after {
      width: 92px;
      height: 92px;
      right: 102px;
      bottom: -48px;
      background: #ffe684;
    }

    .hero-copy { position: relative; z-index: 2; }

    .hero-cat {
      position: absolute;
      z-index: 1;
      width: 180px;
      height: auto;
      right: 2px;
      bottom: -38px;
      transform: rotate(8deg);
      filter: drop-shadow(0 12px 12px rgba(105, 67, 82, .18));
      pointer-events: none;
      user-select: none;
    }

    .speech {
      display: inline-flex;
      align-items: center;
      margin-top: 14px;
      padding: 7px 11px;
      border: 1px solid rgba(164, 90, 136, .12);
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      color: #785469;
      font-size: 12px;
      font-weight: 700;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 6vw, 34px);
      line-height: 1.25;
      letter-spacing: -.02em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .card {
      position: relative;
      margin-bottom: 14px;
      padding: 18px;
      background: var(--card);
      border: 1px solid rgba(111, 85, 181, 0.08);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .card.ribbon::before {
      position: absolute;
      top: 0;
      left: 22px;
      width: 48px;
      height: 6px;
      content: '';
      background: var(--yellow);
      border-radius: 0 0 8px 8px;
    }

    .summary-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .summary-card { overflow: hidden; padding-right: 152px; }

    .basket-cat {
      position: absolute;
      width: 158px;
      height: auto;
      right: -10px;
      bottom: -8px;
      filter: drop-shadow(0 8px 10px rgba(104, 74, 49, .16));
      pointer-events: none;
      user-select: none;
    }

    .summary-label {
      margin: 0 0 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary-value {
      margin: 0;
      font-size: 26px;
      font-weight: 800;
    }

    .percent {
      flex: 0 0 auto;
      min-width: 64px;
      padding: 8px 11px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      text-align: center;
      font-weight: 800;
    }

    .progress-track {
      height: 10px;
      margin-top: 14px;
      overflow: hidden;
      background: #ebe7f2;
      border-radius: 999px;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #8064c7, #5e9b87);
      border-radius: inherit;
      transition: width .25s ease;
    }

    .breakdown {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      padding: 11px 12px;
      background: #faf9fc;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong { font-size: 17px; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    h2 {
      margin: 0;
      font-size: 18px;
    }

    .title-with-cat {
      padding-right: 104px;
    }

    .yawn-cat {
      position: absolute;
      z-index: 0;
      width: 104px;
      height: auto;
      top: -18px;
      right: 8px;
      filter: drop-shadow(0 7px 8px rgba(87, 65, 75, .15));
      pointer-events: none;
      user-select: none;
    }

    .count {
      color: var(--muted);
      font-size: 13px;
    }

    .task-list {
      display: grid;
      gap: 10px;
    }

    .task {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      min-height: 54px;
      padding: 13px;
      cursor: pointer;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .task:active { transform: scale(.995); }

    .task:hover { border-color: #cfc2eb; }

    .task.done {
      background: #f6fbf8;
      border-color: #c9e2d7;
    }

    .task input[type="checkbox"] {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      margin: 1px 0 0;
      accent-color: var(--success);
    }

    .task-main { min-width: 0; }

    .task-name {
      display: block;
      font-size: 15px;
      font-weight: 700;
    }

    .task.done .task-name {
      color: #6e7e77;
      text-decoration: line-through;
    }

    .task-note {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    details {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    summary {
      cursor: pointer;
      color: var(--primary);
      font-weight: 700;
    }

    .tips {
      margin: 10px 0 0;
      padding-left: 20px;
      color: var(--muted);
      font-size: 13px;
    }

    textarea {
      width: 100%;
      min-height: 118px;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: #fbfafc;
    }

    .notes-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .portrait {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      object-fit: cover;
      border: 4px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #f2bed2, 0 7px 14px rgba(91, 65, 79, .14);
    }

    .notes-title { flex: 1; }

    .notes-title h2 { margin-bottom: 2px; }

    .notes-title p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    textarea:focus, .add-row input:focus {
      border-color: #a996d5;
      box-shadow: 0 0 0 3px rgba(111, 85, 181, .10);
    }

    .saved-hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .add-row input {
      min-width: 0;
      flex: 1;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
    }

    .btn {
      border: 0;
      border-radius: 11px;
      padding: 10px 14px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }

    .btn.secondary {
      background: #eeeaf5;
      color: #5d526f;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .action-row .btn { width: 100%; }

    .delete-item {
      margin-left: auto;
      padding: 2px 4px;
      border: 0;
      background: transparent;
      color: #a09aa8;
      cursor: pointer;
      font-size: 12px;
    }

    .footer-note {
      margin: 16px 6px 0;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 420px) {
      .page { padding-inline: 10px; }
      .card { padding: 15px; border-radius: 16px; }
      .hero {
        grid-template-columns: minmax(0, 1fr) 118px;
        min-height: 198px;
        padding: 20px 14px;
        border-radius: 20px;
      }
      .hero-copy { max-width: 68%; }
      .hero-cat { width: 145px; right: -18px; bottom: -25px; }
      .speech { max-width: 170px; border-radius: 14px; }
      .summary-card { padding-right: 110px; }
      .basket-cat { width: 122px; right: -15px; }
      .breakdown { gap: 8px; }
      .add-row { flex-direction: column; }
      .add-row .btn { width: 100%; }
      .action-row { grid-template-columns: 1fr 1fr; }
      .action-row .danger { grid-column: 1 / -1; }
    }
  </style>
</head>

          <h2>本节学习笔记</h2>
          <p>金龙鱼会用严肃的眼神检查作业</p>

        <span class="count">自动保存</span>
      </div>
      <textarea id="notes" placeholder="记录老师强调的内容、自己的疑问，以及与金龙鱼训练有关的想法……"></textarea>
      <p class="saved-hint" id="saveHint">勾选状态和笔记保存在当前浏览器中。</p>
    </section>

    <div class="action-row">
      <button class="btn secondary" id="exportBtn" type="button">备份进度</button>
      <button class="btn secondary" id="importBtn" type="button">恢复进度</button>
      <button class="btn secondary danger" id="resetBtn" type="button">清空本页</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
    <p class="footer-note">项目目标：逐步帮助金龙鱼配合必要的医疗检查。</p>
  </main>

  <script>
    (function () {
      var STORAGE_KEY = 'jinlongyu-clicker-lesson-1-v1';
      var defaultState = { checks: {}, notes: '', custom: [] };
      var state = loadState();

      function loadState() {
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return JSON.parse(JSON.stringify(defaultState));
          var parsed = JSON.parse(saved);
          return {
            checks: parsed.checks || {},
            notes: parsed.notes || '',
            custom: Array.isArray(parsed.custom) ? parsed.custom : []
          };
        } catch (error) {
          return JSON.parse(JSON.stringify(defaultState));
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          var hint = document.getElementById('saveHint');
          hint.textContent = '已自动保存';
          window.clearTimeout(saveState.timer);
          saveState.timer = window.setTimeout(function () {
            hint.textContent = '勾选状态和笔记保存在当前浏览器中。';
          }, 1200);
        } catch (error) {
          document.getElementById('saveHint').textContent = '当前浏览器未允许保存，请勿关闭页面。';
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char];
        });
      }

      function applySavedChecks() {
        document.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (box) {
          box.checked = Boolean(state.checks[box.getAttribute('data-id')]);
          box.closest('.task').classList.toggle('done', box.checked);
        });
      }

      function bindCheckboxes(root) {
        root.querySelectorAll('input[type="checkbox"][data-id]').forEach(function (box) {
          box.addEventListener('change', function () {
            var id = box.getAttribute('data-id');
            state.checks[id] = box.checked;
            box.closest('.task').classList.toggle('done', box.checked);
            saveState();
            updateProgress();
          });
        });
      }

      function renderCustomItems() {
        var list = document.getElementById('customList');
        list.innerHTML = state.custom.map(function (item) {
          return '<label class="task" data-kind="custom">' +
            '<input type="checkbox" data-id="' + escapeHtml(item.id) + '">' +
            '<span class="task-main"><span class="task-name">' + escapeHtml(item.name) + '</span></span>' +
            '<button class="delete-item" type="button" data-delete="' + escapeHtml(item.id) + '">删除</button>' +
          '</label>';
        }).join('');

        document.getElementById('customCount').textContent = state.custom.length + ' 个';
        applySavedChecks();
        bindCheckboxes(list);

        list.querySelectorAll('[data-delete]').forEach(function (button) {
          button.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            var id = button.getAttribute('data-delete');
            state.custom = state.custom.filter(function (item) { return item.id !== id; });
            delete state.checks[id];
            saveState();
            renderCustomItems();
            updateProgress();
          });
        });
      }

      function updateProgress() {
        var all = Array.prototype.slice.call(document.querySelectorAll('input[type="checkbox"][data-id]'));
        var formal = all.filter(function (box) { return box.closest('.task').dataset.kind === 'formal'; });
        var demo = all.filter(function (box) { return box.closest('.task').dataset.kind === 'demo'; });
        var done = all.filter(function (box) { return box.checked; }).length;
        var formalDone = formal.filter(function (box) { return box.checked; }).length;
        var demoDone = demo.filter(function (box) { return box.checked; }).length;
        var percentage = all.length ? Math.round(done / all.length * 100) : 0;

        document.getElementById('doneTotal').textContent = done;
        document.getElementById('allTotal').textContent = all.length;
        document.getElementById('percent').textContent = percentage + '%';
        document.getElementById('progressBar').style.width = percentage + '%';
        document.getElementById('formalProgress').textContent = formalDone + '/' + formal.length;
        document.getElementById('demoProgress').textContent = demoDone + '/' + demo.length;
      }

      document.getElementById('notes').value = state.notes;
      document.getElementById('notes').addEventListener('input', function (event) {
        state.notes = event.target.value;
        saveState();
      });

      document.getElementById('addForm').addEventListener('submit', function (event) {
        event.preventDefault();
        var input = document.getElementById('newItem');
        var name = input.value.trim();
        if (!name) return;
        state.custom.push({ id: 'custom-' + Date.now(), name: name });
        input.value = '';
        saveState();
        renderCustomItems();
        updateProgress();
      });

      document.getElementById('resetBtn').addEventListener('click', function () {
        if (!window.confirm('确定要清空全部勾选、补充项目和笔记吗？')) return;
        state = JSON.parse(JSON.stringify(defaultState));
        document.getElementById('notes').value = '';
        renderCustomItems();
        applySavedChecks();
        updateProgress();
        saveState();
      });

      document.getElementById('exportBtn').addEventListener('click', function () {
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = '金龙鱼第一节学习进度.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      });

      document.getElementById('importBtn').addEventListener('click', function () {
        document.getElementById('importFile').click();
      });

      document.getElementById('importFile').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var parsed = JSON.parse(String(reader.result || ''));
            state = {
              checks: parsed.checks || {},
              notes: parsed.notes || '',
              custom: Array.isArray(parsed.custom) ? parsed.custom : []
            };
            document.getElementById('notes').value = state.notes;
            renderCustomItems();
            applySavedChecks();
            updateProgress();
            saveState();
            window.alert('进度已恢复。');
          } catch (error) {
            window.alert('这个备份文件无法读取，请选择本面板导出的 JSON 文件。');
          }
          event.target.value = '';
        };
        reader.readAsText(file);
      });

      applySavedChecks();
      bindCheckboxes(document);
      renderCustomItems();
      updateProgress();

      window.addEventListener('pagehide', saveState);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'hidden') saveState();
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    }());
  </script>
